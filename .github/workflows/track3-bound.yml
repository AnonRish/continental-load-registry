name: Track 3 residual-bound checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  residual-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pytest tests/test_track3_bound.py -q
      - run: python track3_bound.py --input data/track3/residual_bound_input.example.json
      - run: python verify_track3.py
