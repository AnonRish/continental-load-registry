name: Track 3 Entity Resolution Rebuild

on:
  push:
    branches: [main]
    paths:
      - "build_entity_resolution.py"
      - "index.html"
      - "data/project_level_extractions.json"
      - "data/epoch_site_evidence_records.json"
      - "data/track3/building_footprints_index.json"
      - "data/external/epoch_ai/registry.json"
      - ".github/workflows/track3_entity_resolution.yml"
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * 0"

permissions:
  contents: write

concurrency:
  group: track3-writers-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build entity resolution graph
        run: python build_entity_resolution.py

      - name: Validate entity graph contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path("data/track3/entity_resolution.json").read_text(encoding="utf-8"))
          entities = {x["entity_id"] for x in j["entities"]}
          rels = j["relationships"]
          assert j["stats"]["entity_count"] == len(j["entities"])
          assert j["stats"]["relationship_edge_count"] == len(rels)
          assert j["stats"]["parent_subsidiary_edges"] == sum(r["relationship_type"] == "PARENT_SUBSIDIARY" for r in rels)
          assert all(r["from_entity_id"] in entities and r["to_entity_id"] in entities for r in rels)
          assert all(0 <= float(r["confidence_score"]) <= 1 for r in rels)
          assert all(r.get("evidence_id") for r in rels)
          assert len(j["checklist"]) == 8
          print("PASS: entity resolution graph", j["stats"])
          PY

      - name: Commit entity resolution artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/track3/entity_resolution.json             data/track3/entity_resolution_entities.csv             data/track3/entity_resolution_relationships.csv             data/track3/entity_resolution_research_queue.csv
          if git diff --cached --quiet; then
            echo "No entity resolution changes."
            exit 0
          fi
          git commit -m "Refresh Track 3 entity resolution graph"
          for attempt in 1 2 3; do
            git fetch origin main
            git merge -X ours origin/main --no-edit
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
