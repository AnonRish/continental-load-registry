name: Track 3 ambiguous case closure physical acquisition
on:
  push:
    paths:
      - "acquire_ambiguous_case_physical.py"
      - "acquire_physical_verification.py"
      - "data/track3/ambiguous_case_physical_targets.json"
      - "data/track3/ambiguous_case_studies.json"
      - "validate_ambiguous_case_studies.py"
      - ".github/workflows/track3_ambiguous_case_closure.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: track3-ambiguous-case-closure-main
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install physical acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy rasterio planetary-computer pystac-client
      - name: Validate syntax
        run: python -m py_compile acquire_physical_verification.py acquire_ambiguous_case_physical.py validate_ambiguous_case_studies.py
      - name: Acquire physical observations for closure pilot
        run: python acquire_ambiguous_case_physical.py
      - name: Validate pilot output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/track3/ambiguous_case_physical_observations.json").read_text(encoding="utf-8"))
          assert d["case_count"] == 3
          assert d["observation_count"] > 0
          assert d["derived_observation_count"] > 0
          print("case_count=",d["case_count"])
          print("observation_count=",d["observation_count"])
          print("derived_observation_count=",d["derived_observation_count"])
          for c in d["coordinate_records"]:
              print(c["case_id"],c.get("lat"),c.get("lon"),c.get("precision"))
          PY
      - name: Validate published closure case ledger
        run: python validate_ambiguous_case_studies.py

      - name: Commit pilot physical artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/track3/ambiguous_case_physical_observations.json data/track3/ambiguous_case_physical_observations.csv
          if git diff --cached --quiet; then
            echo "No pilot artifact changes."
            exit 0
          fi
          git commit -m "Refresh ambiguous-case physical pilot observations"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep 3
          done
          exit 1
