name: Validate public research surface

on:
  push:
    paths:
      - "index.html"
      - "track3.html"
      - "plan-a.html"
      - "PLAN_A.md"
      - "CONTRIBUTING.md"
      - "CITATION.cff"
      - "CITATION.md"
      - "README.md"
      - "llms.txt"
      - "robots.txt"
      - "sitemap.xml"
      - "CI_AUDIT_2026-09-26.md"
      - "data/ci/commit_audit.json"
      - "data/track3/ai2040_plan_a_mapping.json"
      - "data/track3/ai2040_plan_a_traceability.json"
      - "data/track3/plan_a_audit_schema.json"
      - "data/track3_evidence_schema.json"
      - "data/large_load_scope.json"
      - "data/supplemental_large_load_evidence.json"
      - "data/project_level_extractions.json"
      - "data/project_level_extractions.csv"
      - "data/market_universe_manifest.json"
      - "data/market_universe_manifest.csv"
      - "data/caiso_cluster_history.json"
      - "data/caiso_cluster_history.csv"
      - "data/project_level_map.json"
      - "data/pjm_large_load_submission_history.json"
      - "data/supplemental_aggregate_map.json"
      - "data/epoch_connection_research_targets.csv"
      - "data/epoch_connection_research_targets.json"
      - "data/epoch_site_evidence_records.csv"
      - "data/epoch_site_evidence_records.json"
      - "data/epoch_ai_map.json"
      - "data/epoch_ai_map.csv"
      - "data/project_level_map.csv"
      - "data/epoch_connection_research_targets.json"
      - "data/epoch_connection_research_targets.csv"
      - "data/epoch_site_evidence_records.json"
      - "data/epoch_site_evidence_records.csv"
      - ".github/workflows/validate_public_surface.yml"
  pull_request:
    paths:
      - "index.html"
      - "track3.html"
      - "plan-a.html"
      - "PLAN_A.md"
      - "CONTRIBUTING.md"
      - "CITATION.cff"
      - "CITATION.md"
      - "README.md"
      - "llms.txt"
      - "robots.txt"
      - "sitemap.xml"
      - "CI_AUDIT_2026-09-26.md"
      - "data/ci/commit_audit.json"
      - "data/track3/ai2040_plan_a_mapping.json"
      - "data/track3/ai2040_plan_a_traceability.json"
      - "data/track3/plan_a_audit_schema.json"
      - "data/track3_evidence_schema.json"


permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate machine-readable Track 3 / Plan A files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              "data/track3/ai2040_plan_a_mapping.json",
              "data/track3/ai2040_plan_a_traceability.json",
              "data/track3/plan_a_audit_schema.json",
              "data/track3_evidence_schema.json",
          ]
          for path in paths:
              obj = json.loads(Path(path).read_text(encoding="utf-8"))
              assert obj, path
          mapping = json.loads(Path("data/track3/ai2040_plan_a_mapping.json").read_text(encoding="utf-8"))
          trace = json.loads(Path("data/track3/ai2040_plan_a_traceability.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("data/track3_evidence_schema.json").read_text(encoding="utf-8"))
          assert len(mapping["mappings"]) >= 16
          assert len(trace["rows"]) >= 12
          assert len(schema["domains"]) >= 15

          scope = json.loads(Path("data/large_load_scope.json").read_text(encoding="utf-8"))
          supplemental = json.loads(Path("data/supplemental_large_load_evidence.json").read_text(encoding="utf-8"))
          assert scope["definitions"]["current_row_level"]["records"] == 1558
          assert scope["definitions"]["additional_known_miso"]["records"] == 83
          assert scope["definitions"]["expanded_known_scope"]["records"] == 1641
          assert scope["definitions"]["expanded_known_scope"]["capacity_gw"] == 397.775
          assert scope["definitions"]["supplemental_evidence_units"]["records"] == 47
          assert scope["definitions"]["project_level_extractions"]["records"] == 199
          assert len(supplemental["records"]) == 47
          projects = json.loads(Path("data/project_level_extractions.json").read_text(encoding="utf-8"))
          assert projects["record_count"] == len(projects["records"]) == 199
          assert len({r["id"] for r in projects["records"]}) == 199
          assert len(projects["sources"]) == 15
          source_counts = {s["id"]: s["record_count"] for s in projects["sources"]}
          assert source_counts["VA-DEQ"] == 33
          assert source_counts["BPA-LARGE-LOAD"] == 60
          assert source_counts["AESO-DATA-LOAD"] == 28
          assert source_counts["NYISO-LOAD-PROJECTS"] == 12
          assert source_counts["NYISO-GOLD-BOOK-2024"] == 9
          assert source_counts["IESO-LOAD"] == 6
          assert source_counts["ISO-NE-CELT"] == 2
          assert source_counts["COMED-NEW-PROJECTS"] == 28
          assert source_counts["DOMINION-SERVICE-PROJECTS"] == 7
          assert source_counts["IDAHO-POWER-2025-IRP"] == 1
          for record in projects["records"]:
              assert record["id"] and record["evidence_type"] and record["source_url"].startswith("https://")
          assert sum(r["evidence_type"] == "environmental_permit_record" for r in projects["records"]) == 33
          assert sum(r["evidence_type"] == "aeso_data_load_project_record" for r in projects["records"]) == 28
          assert sum(r["evidence_type"] == "ieso_load_application_record" for r in projects["records"]) == 6
          assert sum(r["evidence_type"] == "nyiso_load_project_site_record" for r in projects["records"]) == 12
          camellia = next(r for r in projects["records"] if r["id"] == "GA-OPENAI-CAMELLIA-2026")
          assert sorted(x.get("value_mw") for x in camellia["capacity_claims"]) == [3200, 3210]
          alectra = next(r for r in projects["records"] if r["id"] == "ALECTRA-VAUGHAN-MTS6-2026")
          assert sorted(x.get("value_mva") for x in alectra["capacity_claims"]) == [108, 125]
          piketon = next(r for r in projects["records"] if r["id"] == "AEP-SBENERGY-PIKETON-2026")
          assert any(x.get("value_mw") == 10000 for x in piketon["capacity_claims"])
          ids = [r["id"] for r in supplemental["records"]]
          assert len(ids) == len(set(ids))
          for record in supplemental["records"]:
              assert record["id"]
              assert record["jurisdiction"]
              assert record["provider"]
              assert record["evidence_type"]
              assert record["source_url"].startswith("https://")
          assert any(r["id"] == "DOMINION-LARGE-LOAD-QUEUE-2025-12-31" and r["capacity_mw"] == 70000 for r in supplemental["records"])
          assert any(r["id"] == "BCHYDRO-EMERGING-INDUSTRIES-2026" and r["record_count"] == 15 for r in supplemental["records"])
          assert any(r["id"] == "ALECTRA-VAUGHAN-MTS6-2026" and r["capacity_mva"] == 108 for r in supplemental["records"])
          targets = json.loads(Path("data/epoch_connection_research_targets.json").read_text(encoding="utf-8"))
          assert targets["record_count"] == len(targets["records"]) == 93
          assert len({r["epoch_id"] for r in targets["records"]}) == 93
          assert sum(r["status"] == "queue_jurisdiction_mapped_site_id_not_yet_verified" for r in targets["records"]) == 72
          assert sum(r["status"] == "country_connection_system_mapped" for r in targets["records"]) == 16
          assert sum(r["status"] == "site_specific_queue_verified" for r in targets["records"]) == 2
          assert sum(r["status"] == "public_service_contract_verified" for r in targets["records"]) == 2
          assert sum(r["status"] == "public_customer_planning_record" for r in targets["records"]) == 1
          assert all(r["lat"] is not None and r["lon"] is not None for r in targets["records"])
          assert "id=\"connectionTargetsToggle\"" in Path("index.html").read_text(encoding="utf-8")
          assert "id=\"projectEvidenceToggle\"" in Path("index.html").read_text(encoding="utf-8")
          assert "id=\"dataUniverseStatus\"" in Path("index.html").read_text(encoding="utf-8")
          assert "id=\"completeProjectLedger\"" in Path("index.html").read_text(encoding="utf-8")
          assert "id=\"completeConnectionTargetLedger\"" in Path("index.html").read_text(encoding="utf-8")
          assert "id=\"completeSiteEvidenceLedger\"" in Path("index.html").read_text(encoding="utf-8")
          evidence_inventory = json.loads(Path("data/epoch_site_evidence_records.json").read_text(encoding="utf-8"))
          assert evidence_inventory["record_count"] == len(evidence_inventory["records"]) == 68
          assert evidence_inventory["site_count"] == 93
          assert evidence_inventory["sites_with_evidence"] == 59
          assert len({r["id"] for r in evidence_inventory["records"]}) == 68
          target_data = json.loads(Path("data/epoch_connection_research_targets.json").read_text(encoding="utf-8"))
          assert target_data["record_count"] == len(target_data["records"]) == 93
          assert len({r["epoch_id"] for r in target_data["records"]}) == 93
          assert sum(int(r.get("site_level_evidence_count", 0)) for r in target_data["records"]) == 68
          assert all(r["lat"] is not None and r["lon"] is not None for r in target_data["records"])
          universe = json.loads(Path("data/market_universe_manifest.json").read_text(encoding="utf-8"))
          assert len(universe["markets"]) == 10
          epoch_map = json.loads(Path("data/epoch_ai_map.json").read_text(encoding="utf-8"))
          assert epoch_map["record_count"] == 93 and epoch_map["mapped_count"] == 93
          assert sum(1 for r in epoch_map["records"] if r["site_level_evidence_status"] == "evidence_found") == 59
          assert sum(1 for r in epoch_map["records"] if r["site_level_evidence_status"] == "pending_site_specific_search") == 34
          import csv as _csv
          with open("data/epoch_ai_map.csv", newline="", encoding="utf-8") as fh:
              assert len(list(_csv.DictReader(fh))) == 93
          assert len(epoch_map["records"]) == 93
          aggregate_map = json.loads(Path("data/supplemental_aggregate_map.json").read_text(encoding="utf-8"))
          assert aggregate_map["record_count"] == 47 and aggregate_map["mapped_count"] == 47
          pjm_history = json.loads(Path("data/pjm_large_load_submission_history.json").read_text(encoding="utf-8"))
          assert len(pjm_history["records"]) == 28
          project_map = json.loads(Path("data/project_level_map.json").read_text(encoding="utf-8"))
          assert project_map["record_count"] == 199 and project_map["mapped_count"] == 199
          assert len(project_map["records"]) == 199
          history = json.loads(Path("data/caiso_cluster_history.json").read_text(encoding="utf-8"))
          assert sum(r["projects"] for r in history["records"][:7]) == 435
          assert sum(r["capacity_mw"] for r in history["records"][:7]) == 121204
          assert history["records"][7]["projects"] == 48 and history["records"][7]["capacity_mw"] == 14421
          print("PASS: Plan A / Track 3 / expanded market-universe contracts")
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for html_name in ("index.html", "track3.html", "plan-a.html"):
              html = Path(html_name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
              for i, script in enumerate(scripts, 1):
                  Path(f"/tmp/{html_name}-{i}.js").write_text(script, encoding="utf-8")
              print(f"{html_name}: {len(scripts)} script blocks")
          PY
          for f in /tmp/index.html-*.js /tmp/track3.html-*.js /tmp/plan-a.html-*.js; do
            node --check "$f"
          done
      - name: Validate discovery files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          robots = Path("robots.txt").read_text(encoding="utf-8")
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          assert "Sitemap: https://anonrish.github.io/continental-load-registry/sitemap.xml" in robots
          urls = re.findall(r"<loc>(.*?)</loc>", sitemap)
          assert urls
          for url in urls:
              assert url.startswith("https://anonrish.github.io/continental-load-registry/")
          expected_urls = {
              "index.html": "https://anonrish.github.io/continental-load-registry/",
              "track3.html": "https://anonrish.github.io/continental-load-registry/track3.html",
              "plan-a.html": "https://anonrish.github.io/continental-load-registry/plan-a.html",
          }
          for target, url in expected_urls.items():
              assert url in urls, (target, url)
          print("PASS: robots.txt and sitemap.xml")
          PY

# CI invariant: changes to this workflow must execute the complete public-surface validation.
# Re-run the public-surface contract when this validator changes.
