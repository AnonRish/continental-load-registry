name: Track 3 Building Footprint Rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: building-footprints-main
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install footprint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy rasterio shapely pyproj duckdb

      - name: Acquire building polygons
        run: python acquire_building_footprints.py

      - name: Validate polygon layer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/track3")
          idx = json.loads((root / "building_footprints_index.json").read_text(encoding="utf-8"))
          assert idx["site_target_count"] == 93
          assert idx["sites_with_polygon_files"] > 0
          assert idx["total_polygon_count"] > 0
          for record in idx["records"]:
              if record.get("geometry_file"):
                  assert Path(record["geometry_file"]).exists(), record["geometry_file"]
          physical = json.loads((Path("data") / "physical_verification_layer.json").read_text(encoding="utf-8"))
          assert physical["summary"]["building_footprint_polygon_count"] == idx["total_polygon_count"]
          print("PASS:", idx["sites_with_polygon_files"], "sites;", idx["total_polygon_count"], "polygons")
          PY

      - name: Commit footprint artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/physical_verification_layer.json             data/track3_evidence_schema.json             data/track3/building_footprints_index.json             data/track3/building_footprints/
          if git diff --cached --quiet; then
            echo "No building footprint changes."
            exit 0
          fi
          git commit -m "Publish Track 3 building footprint polygons"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
