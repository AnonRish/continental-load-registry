name: Sync MISO complete public queue

on:
  schedule:
    - cron: "40 8 * * *"
  push:
    paths:
      - "sync_miso_public_queue.py"
      - ".github/workflows/sync_miso_public_queue.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miso-public-queue
  cancel-in-progress: true

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests
      - name: Self-test
        run: python sync_miso_public_queue.py --selftest
      - name: Download and normalize
        run: python sync_miso_public_queue.py --output-dir data
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=Path("data/miso_public_queue.json")
          o=json.loads(q.read_text(encoding="utf-8"))
          assert o["record_count"] == len(o["records"]) > 0
          s=json.loads(Path("data/miso_public_queue_summary.json").read_text(encoding="utf-8"))
          assert s["record_count"] == o["record_count"]
          u=json.loads(Path("data/miso_unresolved_large_loads.json").read_text(encoding="utf-8"))
          assert u["record_count"] == s["missing_ge_100_location"] == len(u["records"])
          assert all(r["source_url"].startswith("https://") and r["research_query"] for r in u["records"])
          assert Path("data/miso_public_queue.csv").stat().st_size > 0
          print("PASS: MISO complete public queue", o["record_count"])
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/miso_public_queue.json data/miso_public_queue.csv data/miso_public_queue_summary.json data/miso_unresolved_large_loads.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Automated MISO complete public queue sync: $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
