    - name: '[Track 3] Alert on source/adapter failures'
      id: g11_s32
      if: always()
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          const path = 'data/automation/pipeline_report.json';
          if (!fs.existsSync(path)) return;
          const r = JSON.parse(fs.readFileSync(path, 'utf8'));
          const failures = [];
          for (const x of (r.adapter_run?.runs || [])) {
            if (x.status === 'FAILED') failures.push('adapter: ' + x.source + ' (' + x.exit_code + ')');
          }
          const q = r.quality_summary || {};
          if ((q.remote_source_failures || 0) > 0) failures.push('remote sources failed: ' + q.remote_source_failures);
          if (!failures.length) return;
          const title = '[Track 3 automated source alert] pipeline failures detected';
          const body = [
            'Automated Track 3 pipeline detected source/adapter failures.',
            '',
            ...failures.map(x => '- ' + x),
            '',
            'Pipeline commit: ' + r.pipeline_commit,
            'Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
            '',
            'Inspect data/automation/adapter_run_report.json and source_health.json.'
          ].join('\\n');
          const open = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
          });
          const existing = open.find(i => i.title === title);
          if (existing) {
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
          } else {
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
          }
      continue-on-error: true
      timeout-minutes: 120
    - name: '[Track 3] Validate publishable pipeline state'
      id: g11_s33
      if: always()
      run: |
        python - <<'PY'
        import json,sys
        from pathlib import Path
        root=Path("data/automation")
        required=("adapter_run_report.json","data_quality_report.json","pipeline_report.json","source_health.json","queue_release_diff.json","duplicate_report.json","geographic_match_report.json")
        missing=[name for name in required if not (root/name).exists() or (root/name).stat().st_size==0]
        if missing:
            print("FAIL: missing Track 3 automation report(s):", ", ".join(missing))
            sys.exit(1)
        adapter=json.loads((root/"adapter_run_report.json").read_text())
        quality=json.loads((root/"data_quality_report.json").read_text())
        failures=[]
        if quality.get("summary",{}).get("duplicate_id_groups",0): failures.append('duplicate ID groups=' + str(quality['summary']['duplicate_id_groups']))
        if quality.get("summary",{}).get("evidence_missing_urls",0): failures.append('evidence records missing URLs=' + str(quality['summary']['evidence_missing_urls']))
        if failures:
            print('FAIL:', '; '.join(failures))
            sys.exit(1)
        if adapter.get("failed_count",0):
            print('WARNING: one or more source adapters failed; failure state is retained in adapter_run_report.json and no unavailable source is converted to zero records.')
        print('PASS: Track 3 publish-state validation')
        PY
      continue-on-error: true
      timeout-minutes: 120
    - name: '[Research backlog] Reconcile public enrichment into closure register'
      id: g12_s03
      run: python reconcile_track3_public_enrichment.py
      continue-on-error: true
      timeout-minutes: 15
    - name: '[Research backlog] Build one-task research backlog'
      id: g12_s04
      if: ${{ steps.g12_s03.outcome == 'success' }}
      run: python build_track3_research_backlog.py
      continue-on-error: true
      timeout-minutes: 15
    - name: '[Research backlog] Validate generated counts'
      id: g12_s05
      if: ${{ steps.g12_s04.outcome == 'success' }}
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        d=json.loads(Path("data/track3/research_backlog_summary.json").read_text())
        assert d["publisher_tasks"] == sum(d["publisher_by_field"].values())
        assert d["domain_tasks"] == sum(d["domain_by_domain"].values())
        assert d["total_tasks"] == d["publisher_tasks"] + d["domain_tasks"]
        assert d["coverage_assertions"]["publisher_tasks_equal_effective_unresolved"]
        assert d["coverage_assertions"]["domain_tasks_equal_open_cells"]
        assert d["coverage_assertions"]["all_93_sites_represented"]
        print("PASS: research backlog coverage assertions")
        PY
      continue-on-error: true
      timeout-minutes: 15
    - name: Rebuild derived counts and exports
      run: |-
        python refresh_derived_counts.py
        python refresh_source_manifest.py
    - name: Verify (offline)
      run: python verify.py
    - name: Commit and push refreshed data
      if: ${{ success() && !inputs.dry_run && github.ref == 'refs/heads/main' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No data changes today."
          exit 0
        fi
        git status --short | head -100
        git commit -q -m "Daily public-data refresh: $(date -u +%F)"
        for attempt in 1 2 3 4 5; do
          git fetch -q origin main
          git rebase -q origin/main && git push -q origin HEAD:main && exit 0
          git rebase --abort 2>/dev/null || true
          sleep $((attempt * 10))
        done
        echo "::error::could not push after 5 attempts"; exit 1
    - name: Report sources that failed today
      if: always()
      env:
        STEPS_JSON: ${{ toJSON(steps) }}
      shell: python
      run: |
        import json, os
        steps = json.loads(os.environ['STEPS_JSON'])
        failed = sorted(k for k, v in steps.items() if v.get('outcome') == 'failure')
        lines = ['### Daily refresh', '']
        lines += [f'- failed: `{k}`' for k in failed] or ['All sources refreshed.']
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
            fh.write('\n'.join(lines) + '\n')
        print('\n'.join(lines))
        raise SystemExit(1 if failed else 0)
