# One daily job refreshes every public source in sequence and makes a single commit.
# Each source's steps are chained: a failing source skips only its own remaining steps,
# the other sources still refresh, and the run is marked failed at the end.
# Generated from the former per-source workflows; edit this file directly from now on.
name: Refresh public data
on:
  schedule:
  - cron: 17 6 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every source but do not commit
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: refresh-public-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install dependencies
      run: |-
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: '[Registry] Install dependencies'
      id: g01_s03
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Self-test ingest_grid_queues.py'
      id: g01_s04
      if: ${{ steps.g01_s03.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: python ingest_grid_queues.py --selftest
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Self-test compute_anomaly_detector.py'
      id: g01_s05
      if: ${{ steps.g01_s04.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: python compute_anomaly_detector.py --selftest
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Self-test Module 1 physical radar'
      id: g01_s06
      if: ${{ steps.g01_s05.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        python module1_physical_radar.py --selftest
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Self-test investigate_ambiguous_loads.py and guard_registry_refresh.py'
      id: g01_s07
      if: ${{ steps.g01_s06.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        python investigate_ambiguous_loads.py --selftest
        python guard_registry_refresh.py --selftest
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Prepare work directory'
      id: g01_s08
      if: ${{ steps.g01_s07.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        mkdir -p "$RUNNER_TEMP/registry_work" data
        echo "WORK=$RUNNER_TEMP/registry_work" >> "$GITHUB_ENV"
        echo "SYNC_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Pipeline 1/5 - fetch live feeds'
      id: g01_s09
      if: ${{ steps.g01_s08.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        python ingest_grid_queues.py --include-raw-fields \
          --source-health-output "$WORK/source_health.json" \
          --output "$WORK/registry_raw.csv" 2>&1 | tee "$WORK/ingest.log"
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Pipeline 2/5 - require at least one row'
      id: g01_s10
      if: ${{ steps.g01_s09.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        rows=$(( $(wc -l < "$WORK/registry_raw.csv") - 1 ))
        echo "Rows written by ingest: $rows"
        if [ "$rows" -lt 1 ]; then
          echo "::error title=No registry rows::Every feed failed or every row was filtered out. See the ingest.log in the run artifacts."
          exit 1
        fi
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Pipeline 3/5 - estimate compute load'
      id: g01_s11
      if: ${{ steps.g01_s10.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        python compute_anomaly_detector.py \
          --input "$WORK/registry_raw.csv" \
          --output "$WORK/computational_load_estimates.csv" \
          --review-table-output "$WORK/review_candidates.md" 2>&1 | tee "$WORK/detector.log"
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Pipeline 4/5 - gate each RTO against the published registry'
      id: guard
      if: ${{ steps.g01_s11.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        python guard_registry_refresh.py \
          --html index.html \
          --raw "$WORK/registry_raw.csv" \
          --enriched "$WORK/computational_load_estimates.csv" \
          --out-raw data/registry_raw.csv \
          --out-enriched data/computational_load_estimates.csv \
          --source-health "$WORK/source_health.json" \
          --summary-md "$GITHUB_STEP_SUMMARY" \
          --github-output "$GITHUB_OUTPUT"
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Pipeline 5/5 - embed accepted RTOs into index.html'
      id: g01_s13
      if: ${{ steps.guard.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        python embed_registry_data.py \
          --raw data/registry_raw.csv \
          --enriched data/computational_load_estimates.csv | tee "$WORK/embed.out"
        {
          echo '### Registry embedded in index.html (before / after)'
          echo '```'
          cat "$WORK/embed.out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Validate and summarize Module 1 radar'
      id: g01_s14
      if: ${{ steps.g01_s13.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: python module1_physical_radar.py --selftest --audit
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Build facility research records'
      id: g01_s15
      if: ${{ steps.g01_s14.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        python build_facility_records.py \
          --html index.html \
          --raw data/registry_raw.csv \
          --raw data/registry_raw_new5.csv \
          --enriched data/computational_load_estimates.csv \
          --source-manifest data/source_manifest.json \
          --output-dir data/facility_records \
          --capture-date "$SYNC_DATE" \
          --check
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Verify the regulatory PDF links are intact'
      id: g01_s16
      if: ${{ steps.g01_s15.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        status=0
        for f in FERC_Docket_RM26-4-000_Comments_Computational_Load_Telemetry.pdf \
                 BIS_Rulemaking_Petition_5USC553e_Computational_Load_CEII_Protocol.pdf; do
          if ! grep -Eq "file: *\"$f\", *available: *true" index.html; then
            echo "::error title=Filing link broken::index.html no longer lists $f as available"
            status=1
          fi
          if [ ! -f "$f" ]; then
            echo "::warning title=PDF missing from repository root::$f is linked from index.html but is not in the repository root, so its Download button will 404."
          fi
        done
        exit "$status"
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Show what changed'
      id: g01_s17
      if: ${{ steps.g01_s16.outcome == 'success' }}
      env:
        PYTHONUNBUFFERED: '1'
      run: |
        git status --short
        git diff --stat -- index.html data
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Upload logs and fresh outputs'
      id: g01_s18
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: registry-sync-${{ github.run_id }}
        path: ${{ runner.temp }}/registry_work
        retention-days: 30
        if-no-files-found: ignore
      env:
        PYTHONUNBUFFERED: '1'
      continue-on-error: true
      timeout-minutes: 60
    - name: '[Registry] Fail the run if any RTO refresh was rejected'
      id: g01_s21
      if: ${{ always() && steps.guard.outputs.rejected != '' }}
      env:
        PYTHONUNBUFFERED: '1'
        REJECTED: ${{ steps.guard.outputs.rejected }}
      run: |
        echo "::error title=Registry refresh partly rejected::Rejected: $REJECTED. Accepted RTOs were committed (unless dry run); the rejected ones kept their previous rows. See the 'Registry refresh gate' table in the run summary."
        exit 1
      continue-on-error: true
      timeout-minutes: 60
    - name: '[BPA] Sync to latest main before ingestion'
      id: g02_s02
      run: |
        git fetch origin main
        git reset --hard origin/main
      continue-on-error: true
      timeout-minutes: 20
    - name: '[BPA] Install dependencies'
      id: g02_s04
      if: ${{ steps.g02_s02.outcome == 'success' }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      continue-on-error: true
      timeout-minutes: 20
    - name: '[BPA] Self-test BPA parser'
      id: g02_s05
      if: ${{ steps.g02_s04.outcome == 'success' }}
      run: python ingest_bpa_large_loads.py --selftest
      continue-on-error: true
      timeout-minutes: 20
    - name: '[BPA] Fetch and normalize official BPA load workbook'
      id: g02_s06
      if: ${{ steps.g02_s05.outcome == 'success' }}
      run: python ingest_bpa_large_loads.py
      continue-on-error: true
      timeout-minutes: 20
    - name: '[BPA] Run cross-artifact consistency checks'
      id: g02_s07
      if: ${{ steps.g02_s06.outcome == 'success' }}
      run: python refresh_derived_counts.py && python validate_cross_artifact_consistency.py
      continue-on-error: true
      timeout-minutes: 20
    - name: '[BPA] Show refresh result'
      id: g02_s08
      if: ${{ steps.g02_s07.outcome == 'success' }}
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        p=json.loads(Path("data/bpa_large_load_registry.json").read_text(encoding="utf-8"))
        print("BPA rows:", p["record_count"])
        print("Mapped:", p["mapped_record_count"])
        print("Unmapped:", p["unmapped_record_count"])
        print("Capture:", p["generated_on"])
        print("Workbook SHA-256:", p["source"]["raw_official_snapshot_sha256"])
        PY
        git diff --stat -- data/bpa_large_load_registry.json data/bpa_large_load_registry.csv data/map_layer_manifest.json data/map_layer_manifest.csv data/market_universe_manifest.json data/market_universe_manifest.csv data/public_data_catalog.json data/data_universe_checklist.json data/data_universe_checklist.csv index.html
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Compute universe] Refresh open-data snapshots'
      id: g03_s02
      run: python scripts/sync_global_compute_sources.py
      continue-on-error: true
      timeout-minutes: 30
    - name: '[Compute universe] Validate snapshots'
      id: g03_s03
      if: ${{ steps.g03_s02.outcome == 'success' }}
      shell: python
      run: |
        import json
        from pathlib import Path
        checks = [
            ("data/external/compute_atlas/facilities.json", "compute_atlas"),
            ("data/external/data_center_index/campuses.json", "data_center_index"),
        ]
        for path, label in checks:
            p = Path(path)
            if not p.exists():
                raise SystemExit(f"{label}: missing {path}")
            payload = json.loads(p.read_text(encoding="utf-8"))
            records = payload.get("facilities") if isinstance(payload, dict) and "facilities" in payload else payload
            if not isinstance(records, list) or not records:
                raise SystemExit(f"{label}: no records")
            print(label, len(records), "records")
      continue-on-error: true
      timeout-minutes: 30
    - name: '[Company universe] Build company/facility snapshot'
      id: g04_s02
      run: python scripts/sync_company_universe.py
      continue-on-error: true
      timeout-minutes: 30
    - name: '[Company universe] Validate snapshot'
      id: g04_s03
      if: ${{ steps.g04_s02.outcome == 'success' }}
      shell: python
      run: |
        import json
        from pathlib import Path
        p = Path("data/company_operator_universe_2026-09-27.json")
        s = json.loads(p.read_text(encoding="utf-8"))
        assert s["operator_count"] > 0
        assert s["operator_loaded_count"] > 0
        assert s["facility_reference_count"] > 0
        assert s["unique_facility_key_count"] > 0
        print("operators:", s["operator_count"])
        print("loaded:", s["operator_loaded_count"])
        print("facility references:", s["facility_reference_count"])
        print("unique facility keys:", s["unique_facility_key_count"])
      continue-on-error: true
      timeout-minutes: 30
    - name: '[CAISO] Install dependencies'
      id: g05_s03
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl requests
      continue-on-error: true
      timeout-minutes: 20
    - name: '[CAISO] Self-test parser'
      id: g05_s04
      if: ${{ steps.g05_s03.outcome == 'success' }}
      run: python sync_caiso_public_queue.py --selftest
      continue-on-error: true
      timeout-minutes: 20
    - name: '[CAISO] Download and normalize complete CAISO queue'
      id: g05_s05
      if: ${{ steps.g05_s04.outcome == 'success' }}
      run: python sync_caiso_public_queue.py --output-dir data
      continue-on-error: true
      timeout-minutes: 20
    - name: '[CAISO] Validate output'
      id: g05_s06
      if: ${{ steps.g05_s05.outcome == 'success' }}
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        root = Path("data")
        q = json.loads((root/"caiso_public_queue.json").read_text(encoding="utf-8"))
        assert q["record_count"] == len(q["records"]) > 0
        assert set(q["sheet_counts"]) == {"Grid GenerationQueue", "Completed Generation Projects", "Withdrawn Generation Projects"}
        assert sum(q["sheet_counts"].values()) == q["record_count"]
        assert (root/"caiso_public_queue.csv").stat().st_size > 0
        summary = json.loads((root/"caiso_public_queue_summary.json").read_text(encoding="utf-8"))
        assert summary["record_count"] == q["record_count"]
        assert summary["records_with_county_and_state"] > 0
        print("PASS: complete CAISO public queue dataset")
        print("records:", q["record_count"])
        print("sheets:", q["sheet_counts"])
        print(">=100MW:", summary["records_ge_100mw"])
        PY
      continue-on-error: true
      timeout-minutes: 20
    - name: '[CAISO] Update queue layer status'
      id: g05_s07
      if: ${{ steps.g05_s06.outcome == 'success' }}
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        now=json.loads(Path("data/caiso_public_queue_summary.json").read_text(encoding="utf-8"))
        status_path=Path("data/queue_layer_status.json")
        obj=json.loads(status_path.read_text(encoding="utf-8"))
        feed=next(f for f in obj["feeds"] if f["id"]=="CAISO")
        feed["snapshot_present"]=True
        feed["last_capture"]=now["captured_at"]
        feed["record_count"]=now["record_count"]
        if "records_ge_100mw" in now: feed["records_ge_100mw"]=now["records_ge_100mw"]
        if "missing_ge_100_location" in now: feed["unresolved_ge_100_location"]=now["missing_ge_100_location"]
        status_path.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
        PY
      continue-on-error: true
      timeout-minutes: 20
    - name: '[CAISO] Refresh derived counts in public artifacts'
      id: g05_s08
      if: ${{ steps.g05_s07.outcome == 'success' }}
      run: python refresh_derived_counts.py
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Self-test sync code'
      id: g06_s03
      run: python sync_epoch_ai_data_centers.py --selftest
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Python syntax check for Track 3 pipeline'
      id: g06_s04
      if: ${{ steps.g06_s03.outcome == 'success' }}
      run: |
        python -m py_compile build_track3_evidence.py validate_track3_ledger.py sync_track3_external_sources.py module1_physical_radar.py
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Download and normalize Epoch AI datasets'
      id: g06_s05
      if: ${{ steps.g06_s04.outcome == 'success' }}
      run: python sync_epoch_ai_data_centers.py --sync
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Build grid and queue crosswalk'
      id: g06_s06
      if: ${{ steps.g06_s05.outcome == 'success' }}
      run: python build_epoch_grid_crosswalk.py
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Build 93-site queue gap analysis'
      id: g06_s07
      if: ${{ steps.g06_s06.outcome == 'success' }}
      run: python build_epoch_queue_gap_analysis.py
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Sync global Track 3 compute sources'
      id: g06_s08
      if: ${{ steps.g06_s07.outcome == 'success' }}
      run: |
        python sync_track3_external_sources.py --selftest
        python sync_track3_external_sources.py
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Build Track 3 evidence artifacts'
      id: g06_s09
      if: ${{ steps.g06_s08.outcome == 'success' }}
      run: python build_track3_evidence.py
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Refresh Module 1 audit summary'
      id: g06_s10
      if: ${{ steps.g06_s09.outcome == 'success' }}
      run: python module1_physical_radar.py --audit
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Validate Track 3 evidence artifacts'
      id: g06_s11
      if: ${{ steps.g06_s10.outcome == 'success' }}
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        root = Path("data/track3")
        summary = json.loads((root/"summary.json").read_text(encoding="utf-8"))
        status = json.loads((root/"site_status.json").read_text(encoding="utf-8"))
        evidence = json.loads((root/"evidence_records.json").read_text(encoding="utf-8"))
        queue = json.loads((root/"research_queue.json").read_text(encoding="utf-8"))
        external = json.loads((root/"external_source_snapshots.json").read_text(encoding="utf-8"))
        assert len(external["records"]) == 14
        assert summary["epoch_site_count"] == 93
        assert len(status["records"]) == 93
        assert evidence["record_count"] == len(evidence["records"])
        assert queue["count"] == len(queue["records"])
        assert summary["pending_grid_connection_research_count"] == queue["count"]
        observation = json.loads((root/"observation_queue.json").read_text(encoding="utf-8"))
        assert observation["task_count"] == len(observation["tasks"])
        assert summary["observation_task_count"] == observation["task_count"]
        assert summary["observation_task_counts_by_domain"] == observation["task_counts_by_domain"]
        assert summary["observation_task_counts_by_priority"] == observation["task_counts_by_priority"]
        print("verified: Track 3 artifacts")
        print("site evidence:", summary["site_level_evidence_site_count"])
        print("site queue IDs:", summary["site_specific_queue_id_count"])
        print("pending grid research:", summary["pending_grid_connection_research_count"])
        PY
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Run canonical Track 3 ledger validator'
      id: g06_s12
      if: ${{ steps.g06_s11.outcome == 'success' }}
      run: python validate_track3_ledger.py
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Validate inline JavaScript syntax'
      id: g06_s13
      if: ${{ steps.g06_s12.outcome == 'success' }}
      run: |
        python - <<'PY'
        import re
        from pathlib import Path
        for html_name, stem in [("index.html","index"),("track3.html","track3")]:
            html = Path(html_name).read_text(encoding="utf-8")
            scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
            for i, script in enumerate(scripts, 1):
                Path(f"/tmp/{stem}-script-{i}.js").write_text(script, encoding="utf-8")
            print(f"{html_name}: extracted {len(scripts)} inline script blocks")
        PY
        for f in /tmp/index-script-*.js /tmp/track3-script-*.js; do
          node --check "$f"
        done
      continue-on-error: true
      timeout-minutes: 20
    - name: '[Epoch AI] Verify the complete Epoch dataset was imported'
      id: g06_s14
      if: ${{ steps.g06_s13.outcome == 'success' }}
      run: |
        python - <<'PY'
        import csv, json
        from pathlib import Path
        root = Path("data/external/epoch_ai")
        reg = json.loads((root/"registry.json").read_text(encoding="utf-8"))
        assert reg["record_count"] == 93, reg["record_count"]
        assert len(reg["records"]) == 93
        with (root/"data_centers.csv").open("r", encoding="utf-8-sig", newline="") as f:
            assert sum(1 for _ in csv.DictReader(f)) == 93
        assert (root/"data_center_timelines.csv").stat().st_size > 0
        assert (root/"data_centers_chip_quantities.csv").stat().st_size > 0
        cw = list(csv.DictReader((root/"crosswalk.csv").open("r", encoding="utf-8", newline="")))
        assert len(cw) == 93
        grid = reg.get("grid_crosswalk_summary", {})
        assert grid.get("all_sites_have_queue_or_connection_jurisdiction") is True
        gap = list(csv.DictReader((root/"queue_gap_analysis.csv").open("r", encoding="utf-8", newline="")))
        assert len(gap) == 93
        assert all(row.get("epoch_id") for row in cw)
        ev = json.loads((root/"site_level_connection_evidence.json").read_text(encoding="utf-8"))
        assert ev["record_count"] == 93
        assert len(ev["records"]) == 93
        assert {r["epoch_id"] for r in ev["records"]} == {r["epoch_id"] for r in reg["records"]}
        assert ev["summary"]["total"] == 93
        sources = json.loads((root/"queue_source_universe.json").read_text(encoding="utf-8"))
        assert len(sources["direct_queue_and_connection_sources"]) >= 20
        assert len(sources["cross_cutting_public_sources"]) >= 10
        print("verified: 93 Epoch AI data-center records + queue crosswalk + gap analysis")
        print("matched:", reg["source"]["raw_sha256"]["data_centers.csv"])
        PY
      continue-on-error: true
      timeout-minutes: 20
    - name: '[MISO] Install dependencies'
      id: g07_s03
      run: python -m pip install --upgrade pip pandas openpyxl requests
      continue-on-error: true
      timeout-minutes: 30
    - name: '[MISO] Self-test'
      id: g07_s04
      if: ${{ steps.g07_s03.outcome == 'success' }}
      run: python sync_miso_public_queue.py --selftest
      continue-on-error: true
      timeout-minutes: 30
    - name: '[MISO] Download and normalize'
      id: g07_s05
      if: ${{ steps.g07_s04.outcome == 'success' }}
      run: python sync_miso_public_queue.py --output-dir data
      continue-on-error: true
      timeout-minutes: 30
    - name: '[MISO] Validate'
      id: g07_s06
      if: ${{ steps.g07_s05.outcome == 'success' }}
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        q=Path("data/miso_public_queue.json")
        o=json.loads(q.read_text(encoding="utf-8"))
        assert o["record_count"] == len(o["records"]) > 0
