name: Sync PJM complete Cycle Service Request universe
on:
  schedule:
    - cron: "50 8 * * *"
  push:
    paths:
      - "sync_pjm_cycle_public_queue.py"
      - ".github/workflows/sync_pjm_cycle_public_queue.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pjm-cycle-public-queue
  cancel-in-progress: true
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests lxml
      - name: Self-test
        run: python sync_pjm_cycle_public_queue.py --selftest
      - name: Sync
        run: python sync_pjm_cycle_public_queue.py --output-dir data
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path("data/pjm_cycle_public_queue.json").read_text())
          assert o["record_count"]==len(o["records"])>0
          s=json.loads(Path("data/pjm_cycle_public_queue_summary.json").read_text())
          assert s["record_count"]==o["record_count"]
          print("PASS: PJM cycle queue",o["record_count"])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pjm_cycle_public_queue.json data/pjm_cycle_public_queue.csv data/pjm_cycle_public_queue_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Automated PJM Cycle Service Request sync: $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
