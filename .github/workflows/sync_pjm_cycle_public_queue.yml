# Re-run corrected PJM browser export from current main script.
# Manual retrigger: 2026-09-26T21:00 ET — rebuild complete public queue snapshot if source is available.
# Triggered after parser verification on 2026-09-26.
# Manual refresh trigger prepared 2026-09-26; scheduled and workflow_dispatch refreshes remain enabled.
# Adapter re-run trigger: 2026-09-27T03:49Z — execute corrected public browser export path.
name: Sync PJM complete Cycle Service Request universe
on:
  schedule:
    - cron: "50 8 * * *"
  push:
    paths:
      - "sync_pjm_cycle_public_queue.py"
      - ".github/workflows/sync_pjm_cycle_public_queue.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pjm-cycle-public-queue
  cancel-in-progress: true
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests lxml
      - name: Self-test
        run: python sync_pjm_cycle_public_queue.py --selftest
      - name: Sync
        run: python sync_pjm_cycle_public_queue.py --output-dir data
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path("data/pjm_cycle_public_queue.json").read_text())
          assert o["record_count"]==len(o["records"])>0
          s=json.loads(Path("data/pjm_cycle_public_queue_summary.json").read_text())
          assert s["record_count"]==o["record_count"]
          print("PASS: PJM cycle queue",o["record_count"])
          PY
      - name: Update queue layer status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          now=json.loads(Path("data/pjm_cycle_public_queue_summary.json").read_text(encoding="utf-8"))
          status_path=Path("data/queue_layer_status.json")
          obj=json.loads(status_path.read_text(encoding="utf-8"))
          feed=next(f for f in obj["feeds"] if f["id"]=="PJM")
          feed["snapshot_present"]=True
          feed["last_capture"]=now["captured_at"]
          feed["record_count"]=now["record_count"]
          if "records_ge_100mw" in now: feed["records_ge_100mw"]=now["records_ge_100mw"]
          if "missing_ge_100_location" in now: feed["unresolved_ge_100_location"]=now["missing_ge_100_location"]
          status_path.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pjm_cycle_public_queue.json data/pjm_cycle_public_queue.csv data/pjm_cycle_public_queue_summary.json
          git add data/queue_layer_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Automated PJM Cycle Service Request sync: $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
