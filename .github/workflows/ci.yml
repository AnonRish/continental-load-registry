name: CI

# Offline verification of the code and the committed data snapshot. Never commits.
# The daily refresh (refresh.yml) runs the same `python verify.py` before it commits.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify (tests, self-tests, reproducibility and cross-artifact checks)
        run: python verify.py
      - name: Check the static Tailwind build is current
        run: |
          npx -y tailwindcss@3.4.17 -c tailwind.config.js -i assets/tailwind.input.css -o "$RUNNER_TEMP/tailwind.css" --minify
          cmp assets/tailwind.css "$RUNNER_TEMP/tailwind.css" || { echo "::error::assets/tailwind.css is stale; rebuild it (see CONTRIBUTING.md)"; exit 1; }
      - name: Lint workflows
        run: |
          pip install actionlint-py
          actionlint -shellcheck=
